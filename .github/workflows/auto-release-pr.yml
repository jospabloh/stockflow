name: Auto Release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-release:
    # Skip if the commit message indicates it's already a release, or if it's authored by the bot
    if: "!startsWith(github.event.head_commit.message, 'chore: release') && !contains(github.event.head_commit.message, 'Automated Release') && github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for git log
          
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Release Automation Script
        env:
          ANTHROPIC_API_KEY_SF: ${{ secrets.ANTHROPIC_API_KEY_SF }}
          CI: true
        run: npm run release

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: release and update documentation"
          branch: "automated/release-pr"
          title: "🚀 Automated Release & Documentation Update"
          body: |
            This PR was automatically generated by the StockFlow Release Automation.
            
            It includes:
            - A bumped version number in `appConfig.js`.
            - An AI-generated changelog entry based on recent commits.
            - Updated permission manifests and base44 snapshots.
            
            Please review the changes and merge if everything looks correct!
          labels: "automated-release"
